# Production overlay — Postgres instead of SQLite, plus startup ordering and
# resource limits. Apply on top of the base file, never on its own:
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
#
# Migrating an existing SQLite instance is NOT automatic. Export your workflows
# first (`make export`), start the Postgres stack against an empty data
# directory, then `make import`. Credentials must be recreated — they are
# encrypted per-database.

services:
  postgres:
    image: postgres:18-alpine
    container_name: n8n-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for the prod profile}
      # Postgres refuses to initialise a non-empty directory, so give it a
      # dedicated subdirectory inside the volume.
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      resources:
        limits:
          memory: 1g

  n8n:
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for the prod profile}
      DB_POSTGRESDB_SCHEMA: public

    depends_on:
      postgres:
        # Without this n8n races the database on boot and crash-loops until
        # Postgres finishes initialising.
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  postgres-data:
    driver: local
